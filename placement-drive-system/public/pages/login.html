<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | CampusFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body class="auth-bg"><main class="auth-card"><div class="brand"><span>↗</span> CampusFlow</div><p class="eyebrow">PLACEMENT PORTAL</p><h1>Welcome back</h1><p class="text-secondary">Sign in to continue to your workspace.</p><form id="login" class="mt-4"><label class="form-label" for="email">Email address</label><input class="form-control mb-3" id="email" type="email" required autocomplete="username"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" required autocomplete="current-password"><div id="msg" class="alert d-none mt-3"></div><button class="btn btn-primary w-100 mt-3">Sign in</button></form><p class="small text-center mt-4">Student new here? <a href="/register">Create an account</a></p></main><script>document.querySelector('#login').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error);location.href='/app'}catch(x){msg.textContent=x.message;msg.className='alert alert-danger mt-3'}finally{b.disabled=false}}</script></body></html>
