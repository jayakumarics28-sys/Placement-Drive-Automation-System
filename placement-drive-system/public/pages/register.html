<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student registration | CampusFlow</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/css/app.css" rel="stylesheet"></head><body class="auth-bg"><main class="auth-card register-card"><div class="brand"><span>↗</span> CampusFlow</div><p class="eyebrow">STUDENT PORTAL</p><h1>Create your account</h1><p class="text-secondary">Register to explore placement opportunities.</p><form id="register" class="row g-3 mt-2"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" required minlength="2"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" required></div><div class="col-md-6"><label class="form-label">Password (8+ characters)</label><input class="form-control" name="password" type="password" required minlength="8"></div><div class="col-md-6"><label class="form-label">Registration number</label><input class="form-control" name="registration_number" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" type="tel"></div><div class="col-md-6"><label class="form-label">Department</label><select class="form-select" name="department" required><option value="">Choose department</option><option>MCA</option><option>CSE</option><option>ECE</option><option>EEE</option><option>MECH</option><option>CIVIL</option><option>MBA</option></select></div><div class="col-md-4"><label class="form-label">Graduation year</label><input class="form-control" name="graduation_year" type="number" min="2020" max="2040" required></div><div class="col-md-4"><label class="form-label">CGPA (0–10)</label><input class="form-control" name="cgpa" type="number" step="0.01" min="0" max="10" required></div><div class="col-md-4"><label class="form-label">Active backlogs</label><input class="form-control" name="active_backlogs" type="number" min="0" value="0" required></div><div class="col-12"><label class="form-label">Skills</label><input class="form-control" name="skills" placeholder="Java, SQL, communication"></div><div class="col-12"><div id="msg" class="alert d-none"></div><button class="btn btn-primary w-100">Create account</button></div></form><p class="small text-center mt-4">Already registered? <a href="/">Sign in</a></p></main><script>document.querySelector('#register').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(f)}),d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent=d.message;msg.className='alert alert-success';setTimeout(()=>location.href='/',1000)}catch(x){msg.textContent=x.message;msg.className='alert alert-danger'}}</script></body></html>
